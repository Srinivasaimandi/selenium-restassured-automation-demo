name: Selenium

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selenium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_ENV: local
      BASE_URL: http://127.0.0.1:9899
      LOGIN_USERNAME: ${{ secrets.TEST_LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.TEST_LOGIN_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Update app submodule to latest main
        run: |
          git submodule update --remote --init app
          echo "Testing app commit: $(git -C app rev-parse HEAD)"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Validate test credentials
        run: |
          if [ -z "$LOGIN_USERNAME" ] || [ -z "$LOGIN_PASSWORD" ]; then
            echo "Configure TEST_LOGIN_USERNAME and TEST_LOGIN_PASSWORD secrets for the bundled app."
            exit 1
          fi

      - name: Install app dependencies
        run: npm ci --prefix app

      - name: Check formatting
        run: mvn -B -ntp spotless:check

      - name: Restore Allure history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .allure/history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      # CI=true (set by GitHub) selects Chrome, preinstalled on the runner, and turns on two
      # retries for failed tests.
      - name: Run tests
        id: tests
        run: mvn -B -ntp test

      - name: Generate Allure report
        if: always() && steps.tests.outcome != 'skipped'
        run: mvn -B -ntp allure:report

      # Only runs on branches keep the trend, so pull requests don't mix into it.
      - name: Save Allure history
        if: always() && steps.tests.outcome != 'skipped' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .allure/history
          key: allure-history-${{ github.run_id }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            target/site/allure-maven-plugin/
            target/surefire-reports/
            target/app-server.log
          if-no-files-found: ignore
